[pytest]
# Пути для поиска тестов
testpaths = tests

# Паттерны имен файлов, классов и функций
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Опции по умолчанию
addopts =
    -v
    --strict-markers
    --tb=short
    --alluredir=allure-results
    --html=report.html
    --self-contained-html

# Маркеры для категоризации тестов
markers =
    smoke: Smoke tests - critical functionality that must work
    regression: Regression tests for existing functionality
    slow: Tests that take a long time to execute
    negative: Negative test cases (invalid inputs, error handling)
    positive: Positive test cases (valid inputs, happy path)
    api: API endpoint tests
    crud: CRUD operation tests

# Минимальная версия pytest
minversion = 7.4

# Логирование
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Таймауты (в секундах)
timeout = 300
timeout_method = thread



